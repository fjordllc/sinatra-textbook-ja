<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" font-family="sans-serif" role="img" aria-label="ブラウザが Web アプリケーションへリクエストを送り、Web アプリケーションがブラウザへレスポンスを返す往復">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3a6ea5"/></marker>
</defs>
<rect x="40" y="60" width="220" height="110" rx="8" fill="#eef1f5" stroke="#b8c2cc" stroke-width="1.5"/>
<text x="150" y="108" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2933">ブラウザ</text>
<text x="150" y="138" text-anchor="middle" font-size="14" font-weight="normal" fill="#52606d">レスポンスを表示</text>
<rect x="500" y="60" width="220" height="110" rx="8" fill="#dce9f2" stroke="#3a6ea5" stroke-width="1.5"/>
<text x="610" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#3a6ea5">Web アプリケーション</text>
<text x="610" y="138" text-anchor="middle" font-size="14" font-weight="normal" fill="#52606d">リクエストを処理</text>
<line x1="270" y1="85" x2="488" y2="85" stroke="#3a6ea5" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="380" y="68" text-anchor="middle" font-size="16" font-weight="bold" fill="#3a6ea5">リクエスト</text>
<line x1="490" y1="148" x2="272" y2="148" stroke="#3a6ea5" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="380" y="188" text-anchor="middle" font-size="16" font-weight="bold" fill="#3a6ea5">レスポンス</text>
</svg>
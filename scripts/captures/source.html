<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>映画図鑑 キャプチャ原版</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#d9dee5;color:#20242a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.capture{position:relative;width:1120px;height:650px;margin:0 0 28px;overflow:hidden;background:#f7f7f4;box-shadow:0 2px 10px #0002}.browser{height:58px;padding:12px 18px;background:#eef1f5;border-bottom:1px solid #c5cad1}.dots{display:inline-flex;gap:7px;margin-right:18px}.dots i{width:12px;height:12px;border-radius:50%;background:#aab1bb}.address{display:inline-block;width:870px;padding:8px 16px;border:1px solid #c8cdd4;border-radius:18px;background:white;color:#48515c;font:14px ui-monospace,monospace}.app{padding:30px 48px}.app h1{margin:0 0 14px;font-size:30px}.app p{line-height:1.7}.site{height:48px;padding:12px 42px;border-bottom:1px solid #ddd;background:#fff;color:#1f4f5f;font-weight:700}.btn{display:inline-block;padding:9px 16px;border-radius:5px;background:#1f6475;color:#fff;text-decoration:none;font-weight:700}.danger{background:#8c1d18}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:11px;border:1px solid #d5d8dc;text-align:left}.table th{background:#edf3f4}.panel{position:absolute;background:#202327;color:#d8dee9;font:15px ui-monospace,SFMono-Regular,monospace}.net{left:0;right:0;bottom:0;height:430px}.tabs{height:42px;padding:12px 20px;border-bottom:1px solid #444;color:#aeb8c4}.tabs b{color:#fff;border-bottom:2px solid #5ea8ff;padding-bottom:10px}.requests{position:absolute;left:0;top:42px;bottom:0;width:45%;border-right:1px solid #444}.details{position:absolute;left:45%;right:0;top:42px;bottom:0;padding:18px}.row{display:grid;grid-template-columns:2fr .8fr .8fr 1fr;padding:8px 14px;border-bottom:1px solid #363a40}.row.head{color:#9ba5b1}.row.selected{background:#194f7e}.kv{display:grid;grid-template-columns:190px 1fr;gap:8px;padding:5px 0}.kv strong{color:#a9c7e8}.call{position:absolute;z-index:3;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#ffcc4d;color:#222;font-weight:800;box-shadow:0 0 0 4px #fff}.outline{position:absolute;z-index:2;border:3px solid #ffcc4d;border-radius:6px;pointer-events:none}.form{max-width:680px}.field{margin:0 0 14px}.field label{display:block;margin-bottom:5px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #aeb4bb;border-radius:4px;background:#fff;font:16px inherit}.error{margin-bottom:16px;padding:12px 16px;border:1px solid #b3261e;border-radius:4px;background:#fff0ee;color:#5f1a16}.split{display:grid;grid-template-columns:1fr 1fr;height:544px}.split>div{position:relative;padding:24px 30px;border-right:1px solid #ccd1d7}.label{display:inline-block;margin-bottom:14px;padding:4px 10px;border-radius:14px;background:#e3e8ee;font-weight:700}.detail{background:white;border:1px solid #d8dade;border-radius:6px}.detail div{display:grid;grid-template-columns:120px 1fr;padding:12px 16px;border-bottom:1px solid #e5e7e9}.detail dt{font-weight:700}.flow{display:flex;align-items:center;justify-content:center;gap:22px;height:500px}.step{width:245px;padding:28px 18px;border:2px solid #3a6ea5;border-radius:10px;background:#fff;text-align:center}.step b{display:block;font-size:22px;color:#275f98}.arrow{font-size:38px;color:#3a6ea5}.code{padding:16px;border-radius:6px;background:#202327;color:#d8dee9;font:15px/1.7 ui-monospace,monospace;white-space:pre-wrap}.safe{color:#166534}.unsafe{color:#9f1239}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;padding:28px}.three .box{min-height:450px;padding:18px;border:1px solid #bcc3cb;border-radius:7px;background:#fff}.three h2{margin:0 0 14px;font-size:19px;color:#275f98}.note{position:absolute;right:26px;top:72px;padding:8px 12px;border-radius:5px;background:#ffefb2;font-size:14px;font-weight:700}
</style>
<body>
<div id="captures"></div>
<script>
const browser=(url)=>`<div class="browser"><span class="dots"><i></i><i></i><i></i></span><span class="address">${url}</span></div>`;
const rows=(items)=>items.map(x=>`<div class="row ${x.s?'selected':''}"><span>${x.n}</span><span>${x.m}</span><span>${x.st}</span><span>${x.t||'document'}</span></div>`).join('');
const net=(items,detail)=>`<div class="panel net"><div class="tabs"><b>Network</b>　Elements　Console</div><div class="requests"><div class="row head"><span>Name</span><span>Method</span><span>Status</span><span>Type</span></div>${rows(items)}</div><div class="details"><div class="tabs"><b>Headers</b>　Payload　Response</div>${detail}</div></div>`;
const appForm=(error=false)=>`<div class="site">映画図鑑</div><div class="app"><h1>映画登録</h1>${error?'<div class="error"><b>入力内容を確認してください。</b><br>・タイトルを入力してください</div>':''}<form class="form"><div class="field"><label>タイトル</label><input value="${error?'':'星屑の駅'}"></div><div class="field"><label>監督</label><input value="山田アキラ"></div><div class="field"><label>公開年</label><input value="2042"></div><div class="field"><label>ジャンル</label><select><option>SF</option></select></div><div class="field"><label>紹介文</label><textarea rows="3">夜空を走る列車と、小さな駅の物語。</textarea></div><span class="btn">登録する</span></form></div>`;
const captures=[
['c1',browser('http://localhost:4567/movies')+net([{n:'movies',m:'GET',st:'200',s:1}],`<h3>General</h3><div class="kv"><strong>Request URL</strong><span>http://localhost:4567/movies</span><strong>Request Method</strong><span>GET</span><strong>Status Code</strong><span>200 OK</span></div>`)+`<i class="call" style="left:475px;top:275px">1</i><i class="call" style="left:650px;top:358px">2</i><i class="call" style="left:650px;top:398px">3</i>`],
['c2',browser('http://localhost:4567/movies')+net([{n:'localhost:4567',m:'GET',st:'302'},{n:'movies',m:'GET',st:'200',s:1}],`<h3>Response Headers</h3><div class="kv"><strong>location</strong><span>/movies</span><strong>status</strong><span>302 Found → 200 OK</span></div>`)+`<i class="call" style="left:350px;top:310px">1</i><i class="call" style="left:350px;top:350px">2</i>`],
['c3',browser('http://localhost:4567/movies')+`<div class="site">映画図鑑</div><div class="app"><h1>映画一覧</h1></div>`+net([{n:'movies',m:'GET',st:'200',t:'document',s:1},{n:'application.css',m:'GET',st:'200',t:'stylesheet'}],`<h3>二つのレスポンス</h3><p>movies → HTML</p><p>application.css → CSS</p>`)+`<div class="outline" style="left:12px;top:310px;width:486px;height:84px"></div>`],
['c4',browser('http://localhost:4567/movies/new')+appForm(false)],
['c5',browser('http://localhost:4567/movies')+`<div class="split"><div>${appForm(false).replace(/^.*?<div class="site">/,'<div class="site">')}</div><div class="panel" style="inset:0;padding:24px"><span class="label">Payload</span><h3>Form Data</h3><div class="kv"><strong>title</strong><span>星屑の駅</span><strong>director</strong><span>山田アキラ</span><strong>year</strong><span>2042</span><strong>genre</strong><span>SF</span><strong>description</strong><span>夜空を走る列車と、小さな駅の物語。</span></div></div></div>`],
['c6',browser('http://localhost:4567/movies')+appForm(true)+`<div class="outline" style="left:42px;top:137px;width:690px;height:76px"></div><i class="call" style="left:750px;top:156px">1</i><i class="call" style="left:750px;top:300px">2</i>`],
['c7',browser('http://localhost:4567/movies')+`<div class="split"><div><span class="label">/movies</span><h1>映画一覧</h1><table class="table"><tr><th>タイトル</th><th>公開年</th><th>操作</th></tr><tr><td>月面喫茶</td><td>2042</td><td>詳細</td></tr><tr><td>北風のリズム</td><td>2038</td><td>詳細</td></tr></table></div><div><span class="label">/movies/moon-cafe</span><h1>月面喫茶</h1><dl class="detail"><div><dt>監督</dt><dd>山田アキラ</dd></div><div><dt>公開年</dt><dd>2042</dd></div><div><dt>ジャンル</dt><dd>SF</dd></div><div><dt>紹介文</dt><dd>月面にある小さな喫茶店を舞台にした物語。</dd></div></dl></div></div>`],
['c8',browser('http://localhost:4567/movies/moon-cafe')+`<div class="site">映画図鑑</div><div class="app"><h1>月面喫茶</h1><dl class="detail"><div><dt>監督</dt><dd>山田アキラ</dd></div><div><dt>公開年</dt><dd>2042</dd></div><div><dt>ジャンル</dt><dd>SF</dd></div><div><dt>紹介文</dt><dd>月面にある小さな喫茶店を舞台にした物語。</dd></div></dl><p><a>一覧へ戻る</a>　<span class="btn">編集する</span>　<span class="btn danger">削除する</span></p></div><div class="outline" style="left:180px;top:460px;width:250px;height:58px"></div>`],
['c9',browser('http://localhost:4567/movies/moon-cafe')+`<div class="three"><div class="box"><h2>1 ブラウザ</h2><p class="code">POST /movies/moon-cafe</p></div><div class="box"><h2>2 Form Data</h2><p class="code">_method=patch\ntitle=月面喫茶 改</p></div><div class="box"><h2>3 Sinatraログ</h2><p class="code">PATCH /movies/moon-cafe\n303 See Other</p></div></div><div class="note">POSTを受け取り、PATCHとして処理する</div>`],
['c10',browser('http://localhost:4567/movies/new')+`<div class="flow"><div class="step"><b>Post</b><p>POST /movies</p></div><span class="arrow">→</span><div class="step"><b>Redirect</b><p>303 See Other<br>Location: /movies/star-station</p></div><span class="arrow">→</span><div class="step"><b>Get</b><p>GET /movies/star-station<br>200 OK</p></div></div>`],
['c11',browser('http://localhost:4567/movies/xss-sample')+`<div class="split"><div><span class="label safe">安全な表示</span><h1>&lt;script&gt;alert(&quot;xss&quot;)&lt;/script&gt;</h1><p>入力が文字として表示され、実行されない。</p><div class="code">&amp;lt;script&amp;gt;alert(&amp;quot;xss&amp;quot;)&amp;lt;/script&amp;gt;</div></div><div><span class="label unsafe">危険な表示（一時確認）</span><h1 style="color:#9f1239">HTMLとして解釈される</h1><p>表示が崩れたり、スクリプトが動く可能性がある。</p><div class="code">&lt;script&gt;alert(&quot;xss&quot;)&lt;/script&gt;</div></div></div>`],
['c12',browser('http://localhost:4567/movies/not-exist')+`<div class="site">映画図鑑</div><div class="app"><h1>ページが見つかりません</h1><p>指定されたページ、または映画は見つかりませんでした。</p><span class="btn">映画一覧へ戻る</span></div>`+net([{n:'not-exist',m:'GET',st:'404',s:1}],`<h3>General</h3><div class="kv"><strong>Request URL</strong><span>/movies/not-exist</span><strong>Status Code</strong><span>404 Not Found</span></div>`)+`<div class="outline" style="left:650px;top:555px;width:300px;height:46px"></div>`],
['c13',browser('http://localhost:4567/movies')+`<div class="three"><div class="box"><h2>1 ブラウザから届いた</h2><p class="code">Form Data\ntitle=星屑の駅\nyear=2042</p></div><div class="box"><h2>2 Sinatraが処理した</h2><p class="code">POST /movies\n303 See Other</p></div><div class="box"><h2>3 JSONへ保存された</h2><p class="code">{\n  &quot;title&quot;: &quot;星屑の駅&quot;,\n  &quot;year&quot;: &quot;2042&quot;\n}</p></div></div>`]
];
document.querySelector('#captures').innerHTML=captures.map(([id,html])=>`<section class="capture" id="${id}">${html}</section>`).join('');
</script>
</html>
